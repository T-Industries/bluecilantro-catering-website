# Local PostgreSQL for development (production uses Neon).
# Start: docker compose up -d     Stop: docker compose down     (data persists in the named volume)
services:
  db:
    image: postgres:16-alpine
    container_name: bluecilantro-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bluecilantro
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bluecilantro']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
